[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "elt-environment"
version = "0.0.0"
description = "Tinker/GRPO coordinator for verified two-stage ELT tasks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "elt-taskgen",
  "tinker==0.27.1",
  "tinker-cookbook==0.5.7",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
elt_environment = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
# The scorer's content hashes are only validated byte-identical across the
# sqlglot versions ELT-taskgen pins. Keep this interpreter on the exact
# version in ELT-taskgen/uv.lock so a rollout scored here and a task scored
# there cannot disagree.
constraint-dependencies = [
  "sqlglot==30.16.0",
  "pydantic==2.13.4",
  "typing-inspection==0.4.3",
]

[tool.uv.sources]
elt-taskgen = { path = "../ELT-taskgen", editable = true }
